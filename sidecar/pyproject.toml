[project]
name = "revisor-sidecar"
version = "0.1.0"
description = "Análisis local de fotos: carga, detección, ocultamiento y exportación."
requires-python = "==3.12.*"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "numpy>=2,<3",
  "onnxruntime>=1.20,<2",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11.3,<13",
  "pillow-heif>=1,<2",
  "pydantic>=2.8,<3",
  "rawpy>=0.21,<1",
  "tokenizers>=0.20,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.100,<7",
  "pyright>=1.1.380",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["modelo: requiere el modelo de caras descargado"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S110", "BLE"]

[tool.pyright]
include = ["revisor"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
venvPath = "."
venv = ".venv"

[tool.ruff.lint.per-file-ignores]
"revisor/errores.py" = ["E501"]
"tests/*" = ["S", "E501", "BLE"]
